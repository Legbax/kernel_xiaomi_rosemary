name: Build Kernel

on:
  push:
    branches:
      - R
      - claude/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      KSU_VERSION: 30337

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            libssl-dev \
            bc \
            bison \
            flex \
            libelf-dev \
            cpio \
            zip \
            python3

      - name: Set up kernel build
        run: |
          touch .scmversion
          sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" \
            KernelSU-Next/kernel/Kbuild
          sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := v3.1.0/" \
            KernelSU-Next/kernel/Kbuild
          # Strip -Werror from all vendor Makefiles (GCC 11+ produces warnings
          # that the original clang toolchain didn't, breaking -Werror builds)
          find drivers/ -name Makefile -exec sed -i 's/-Werror//g' {} +

      - name: Generate defconfig
        run: make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- rosemary_defconfig

      - name: Build kernel
        shell: bash
        run: |
          set -eo pipefail
          make O=out -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log
          ls -la out/arch/arm64/boot/Image* || {
            echo "ERROR: No kernel image produced!"
            tail -100 build.log
            exit 1
          }

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null \
            || cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null \
            || cp out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          sed -i 's|do.devicecheck=1|do.devicecheck=1|' anykernel.sh
          sed -i 's|device.name1=.*|device.name1=rosemary|' anykernel.sh
          sed -i 's|device.name2=.*|device.name2=secret|' anykernel.sh
          sed -i '/device.name3/d' anykernel.sh
          sed -i '/device.name2/a device.name3=maltose' anykernel.sh
          sed -i 's|supported.versions=.*|supported.versions=11|' anykernel.sh
          sed -i 's|kernel.string=.*|kernel.string=KernelSU-Next Kernel for Rosemary|' anykernel.sh
          sed -i 's|block=.*|block=/dev/block/platform/bootdevice/by-name/boot;|' anykernel.sh
          zip -r9 "../KernelSU-Next-v3.1.0-rosemary-KSU${KSU_VERSION}.zip" \
            * -x .git README.md *placeholder

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Rosemary-Kernel
          path: KernelSU-Next-v3.1.0-rosemary-*.zip
          if-no-files-found: error
