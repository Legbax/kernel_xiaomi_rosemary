name: Build Kernel

on:
  push:
    branches:
      - R
      - claude/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      SUBARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      # KernelSU-Next version: 30000 + 277 (git commits at checkout) + 60
      KSU_VERSION: 30337

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            libssl-dev \
            bc \
            bison \
            flex \
            libelf-dev \
            cpio \
            zip \
            python3

      - name: Set up kernel build
        run: |
          # Prevent version suffix
          touch .scmversion

          # Force KSU_VERSION in Kbuild since KernelSU-Next is inlined (no .git)
          sed -i "s/KSU_VERSION_FALLBACK := 1/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" \
            KernelSU-Next/kernel/Kbuild
          sed -i "s/KSU_VERSION_TAG_FALLBACK := v0.0.1/KSU_VERSION_TAG_FALLBACK := v3.1.0/" \
            KernelSU-Next/kernel/Kbuild

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          # Generate .config
          make O=out rosemary_defconfig

          # Build
          make O=out -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          # Clone AnyKernel3
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git

          # Copy kernel image
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image.gz AnyKernel3/ 2>/dev/null || \
          cp out/arch/arm64/boot/Image AnyKernel3/

          # Configure AnyKernel3
          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          # AnyKernel3 Ramdisk Mod Script
          # osm0sis @ xda-developers

          properties() { '
          kernel.string=KernelSU-Next Kernel for Rosemary
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=rosemary
          device.name2=secret
          device.name3=maltose
          supported.versions=11
          '; }

          block=/dev/block/platform/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          set_perm_recursive 0 0 755 644 $ramdisk_dir

          dump_boot;

          write_boot;
          AKEOF

          # Create zip
          cd AnyKernel3
          zip -r9 "../KernelSU-Next-v3.1.0-rosemary-KSU${KSU_VERSION}.zip" \
            * -x .git README.md *placeholder

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Rosemary-Kernel
          path: KernelSU-Next-v3.1.0-rosemary-*.zip
          if-no-files-found: error
